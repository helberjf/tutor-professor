<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sem conexao - Tutor and Professor</title>
    <!--
      Pagina estatica de proposito: e a ultima coisa que o service worker tem
      para mostrar quando a rede caiu, entao nao pode depender de nenhum
      JavaScript da aplicacao que talvez nao esteja em cache.
    -->
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f8fafc;
        color: #1e293b;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 26rem;
        width: 100%;
        background: #ffffff;
        border: 2px solid #e2e8f0;
        border-radius: 28px;
        padding: 32px 24px;
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.08);
      }
      .badge {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #38bdf8, #6366f1 55%, #34d399);
      }
      .badge svg { width: 34px; height: 34px; }
      h1 { margin: 0 0 10px; font-size: 1.55rem; font-weight: 800; }
      p { margin: 0 0 22px; font-size: 0.95rem; line-height: 1.6; color: #64748b; }
      button {
        appearance: none;
        border: 0;
        cursor: pointer;
        width: 100%;
        padding: 14px 20px;
        border-radius: 999px;
        background: #0ea5e9;
        color: #ffffff;
        font-size: 0.95rem;
        font-weight: 800;
        letter-spacing: 0.02em;
      }
      button:active { background: #0369a1; }
      @media (prefers-color-scheme: dark) {
        body { background: #0f172a; color: #e2e8f0; }
        .card { background: #1e293b; border-color: #334155; }
        p { color: #94a3b8; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10 12 5 2 10l10 5 10-5Z" />
          <path d="M6 12v5c0 1 2.7 2.5 6 2.5s6-1.5 6-2.5v-5" />
        </svg>
      </div>
      <h1>Voce esta sem internet</h1>
      <p>
        O app precisa de conexao para carregar esta tela. Assim que a internet
        voltar, toque em tentar de novo.
      </p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
